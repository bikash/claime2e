# fly.toml app configuration file generated for claime2e on 2026-09-01T19:58:23Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'claime2e'
primary_region = 'ams'

[build]

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
