app = "claime2e"
primary_region = "ams"

[build]

# Non-secret tuning knobs. Credentials go through `fly secrets set`.
[env]
  DP_KEYS_DIR = "/data/dp-keys"
  AUTO_APPROVE_CAP_EUR = "2500"
  EXTRACTION_CONFIDENCE_MIN = "0.85"
  AZURE_OPENAI_API_VERSION = "2024-02-15-preview"
  AZURE_OPENAI_DEPLOYMENT_NAME = "gpt-4.1"
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME = "text-embedding-3-large"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

# ponytail: single machine + single volume. Uploads are local files, so scaling
# out needs object storage (Tigris/S3) first — not worth it until it matters.
[mounts]
  source = "claim_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
