app = "claime2e"
primary_region = "ams"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

# ponytail: single machine + single volume. Uploads are local files, so scaling
# out needs object storage (Tigris/S3) first — not worth it until it matters.
[mounts]
  source = "claim_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
